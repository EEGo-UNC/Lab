<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a2c" />
    <meta
      name="description"
      content="The EEGo Lab website is coming soon."
    />
    <title>EEGo Lab — Coming soon</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #f4f9ff;
        background: #071a2c;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #123a5a 0, #071a2c 58%);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100% - 3rem, 760px);
        text-align: center;
      }

      .mark {
        width: 120px;
        height: 120px;
        margin: 0 auto 3rem;
        border: 1px solid rgb(127 208 255 / 45%);
        border-radius: 50%;
        display: grid;
        place-items: center;
        animation: breathe 5s ease-in-out infinite;
      }

      .mark::before {
        content: "";
        width: 66px;
        height: 66px;
        border: 3px solid #7fd0ff;
        border-radius: 50%;
        box-shadow: 0 0 30px rgb(127 208 255 / 30%);
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 11vw, 7rem);
        font-weight: 650;
        letter-spacing: -0.07em;
        line-height: 1;
      }

      p {
        margin: 1.5rem auto 0;
        max-width: 34rem;
        color: #bed5e6;
        font-size: clamp(1rem, 2.3vw, 1.25rem);
        line-height: 1.6;
      }

      @keyframes breathe {
        50% { transform: scale(1.08); opacity: 0.72; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>EEGo Lab</h1>
      <p>Our new website is on the way. Projects and updates will appear here soon.</p>
    </main>
  </body>
</html>
